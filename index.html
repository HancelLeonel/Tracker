<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2030">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Hábitos y gastos quincenales">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Mi Quincena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main id="view"></main>
  <button id="fab" class="fab" data-act="new-exp" aria-label="Nuevo gasto" hidden>＋</button>

  <nav id="tabs">
    <button data-act="tab" data-tab="money"><span>💸</span>Finanzas</button>
    <button data-act="tab" data-tab="habits"><span>✅</span>Hábitos</button>
    <button data-act="tab" data-tab="purchases"><span>🛍️</span>Compras</button>
    <button data-act="tab" data-tab="data"><span>💾</span>Datos</button>
  </nav>

  <dialog id="dlg"></dialog>
  <dialog id="viewer"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
