<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111317">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Finanzas, hábitos y compras">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Tracker</title>
  <!-- Descarga los módulos en paralelo en vez de descubrirlos por niveles de import (arranque ~25-35 % más rápido con red móvil).
       Debe incluir todos los .js de js/ (lo verifica tests/smoke.py). -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/db.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/money.js">
  <link rel="modulepreload" href="js/plan.js">
  <link rel="modulepreload" href="js/bills.js">
  <link rel="modulepreload" href="js/reports.js">
  <link rel="modulepreload" href="js/purchases.js">
  <link rel="modulepreload" href="js/habits.js">
  <link rel="modulepreload" href="js/lists.js">
  <link rel="modulepreload" href="js/home.js">
  <link rel="modulepreload" href="js/aviso.js">
  <link rel="modulepreload" href="js/pomodoro.js">
  <link rel="modulepreload" href="js/gym.js">
  <link rel="modulepreload" href="js/notes.js">
  <link rel="modulepreload" href="js/inbox.js">
  <link rel="modulepreload" href="js/data.js">
  <script>try { var f = localStorage.getItem('tracker-font'); if (f) document.documentElement.dataset.font = f; } catch (e) {}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main id="view">
    <!-- Pantalla de carga: se muestra al instante y la reemplaza la primera vista -->
    <div class="boot" role="status" aria-label="Cargando Tracker">
      <svg viewBox="0 0 512 512" width="96" height="96" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#111317"/>
        <circle cx="256" cy="256" r="184" fill="none" stroke="#e8eaee" stroke-width="28"/>
        <path d="M175 262l62 66 102-116" fill="none" stroke="#9aa7f5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>Tracker</b>
    </div>
  </main>
  <button id="fab" class="fab" data-act="new-exp" aria-label="Nuevo gasto" hidden></button>

  <div id="scrim" data-act="menu-close"></div>
  <aside id="drawer" aria-label="Menú principal"></aside>

  <dialog id="dlg"></dialog>
  <dialog id="viewer"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="file" accept="application/json,.json,text/plain,.txt" hidden>

  <script>
    // Si la app no logra arrancar (un módulo que no carga, la base de datos bloqueada, archivos viejos en caché…) se explica qué
    // hacer en vez de dejar solo el logo. «Actualizar la app» borra la caché y el service worker; los datos no se tocan.
    (function () {
      var last = '';
      window.addEventListener('error', function (e) { last = e.message || ''; });
      window.addEventListener('unhandledrejection', function (e) { last = String((e.reason && e.reason.message) || e.reason || ''); });
      setTimeout(function () {
        var boot = document.querySelector('.boot');
        if (!boot) return;
        boot.innerHTML = '';
        var p = document.createElement('p'); p.textContent = 'Tracker no pudo iniciar.';
        var s = document.createElement('small'); var why = last || (window.__loadFailed ? 'no se pudo cargar un archivo de la app' : '');
        s.textContent = 'Prueba reintentar. Si sigue igual, actualiza la app (tus datos no se borran).' + (why ? ' Detalle: ' + why : '');
        var retry = document.createElement('button'); retry.className = 'btn primary'; retry.id = 'boot-retry'; retry.textContent = 'Reintentar';
        retry.onclick = function () { location.reload(); };
        var reset = document.createElement('button'); reset.className = 'btn'; reset.id = 'boot-reset'; reset.textContent = 'Actualizar la app';
        reset.onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
        [p, s, retry, reset].forEach(function (n) { boot.appendChild(n); });
      }, window.__bootWatchdogMs || 10000);
    })();
  </script>
  <script type="module" src="js/app.js" onerror="window.__loadFailed = true"></script>
</body>
</html>
