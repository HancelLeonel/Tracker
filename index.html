<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2030">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Finanzas, hábitos y compras">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Tracker</title>
  <!-- Descarga los módulos en paralelo en vez de descubrirlos por niveles de import (arranque ~25-35 % más rápido con red móvil).
       Debe incluir todos los .js de js/ (lo verifica tests/smoke.py). -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/db.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/money.js">
  <link rel="modulepreload" href="js/plan.js">
  <link rel="modulepreload" href="js/bills.js">
  <link rel="modulepreload" href="js/reports.js">
  <link rel="modulepreload" href="js/purchases.js">
  <link rel="modulepreload" href="js/habits.js">
  <link rel="modulepreload" href="js/lists.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main id="view">
    <!-- Pantalla de carga: se muestra al instante y la reemplaza la primera vista -->
    <div class="boot" role="status" aria-label="Cargando Tracker">
      <svg viewBox="0 0 512 512" width="96" height="96" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#24273a"/>
        <circle cx="256" cy="256" r="184" fill="none" stroke="#fff" stroke-width="28"/>
        <path d="M175 262l62 66 102-116" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>Tracker</b>
    </div>
  </main>
  <button id="fab" class="fab" data-act="new-exp" aria-label="Nuevo gasto" hidden></button>

  <div id="scrim" data-act="menu-close"></div>
  <aside id="drawer" aria-label="Menú principal"></aside>

  <dialog id="dlg"></dialog>
  <dialog id="viewer"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="file" accept="application/json,.json,text/plain,.txt" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
